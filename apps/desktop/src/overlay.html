<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RocksCord overlay</title>
    <!--
      The voice overlay: who is in the call, and who is talking.

      A transparent, click-through, always-on-top window rather than anything injected into
      a game. Discord draws inside the game by hooking its DirectX or OpenGL renderer,
      which is how theirs survives exclusive fullscreen; Electron cannot do that, so this
      floats above instead. That covers windowed and borderless-fullscreen, which is how
      most games are actually run, and is honestly documented as not covering the rest.

      State arrives by `executeJavaScript` from the main process -- the same channel the
      splash uses -- so this page needs no preload, no Node, and no network of its own.
      Speaking detection lives in the main window, where the audio streams are; this is
      only a renderer.
    -->
    <style>
      :root {
        color-scheme: dark;
        --speaking: #3ba55d;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        /* The window itself is transparent; only the pill below paints. */
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
          sans-serif;
        /* Nothing here is interactive: the window is click-through, so a caret or a
           selection would be a lie. */
        user-select: none;
        cursor: default;
      }

      #stack {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 8px;
        /* Aligned by the main process by sizing and placing the window; the column just
           fills whatever it is given. */
        align-items: flex-start;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 10px 4px 4px;
        border-radius: 999px;
        background: rgba(12, 13, 20, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.06);
        max-width: 220px;
        /* Fade in rather than appear: someone unmuting mid-sentence should not make the
           whole overlay flicker. */
        animation: appear 120ms ease-out;
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(2px);
        }
      }

      .avatar {
        position: relative;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #5865f2;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.2px;
        /* The speaking ring is a box-shadow so it costs no layout when it toggles. */
        box-shadow: 0 0 0 0 rgba(59, 165, 93, 0);
        transition: box-shadow 90ms linear;
      }

      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .row.speaking .avatar {
        box-shadow: 0 0 0 2px var(--speaking);
      }

      .name {
        font-size: 12.5px;
        line-height: 1;
        color: rgba(255, 255, 255, 0.72);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .row.speaking .name {
        color: #fff;
      }

      /* Muted and deafened are shown, because "why can nobody hear me" is the single
         most common thing an overlay is squinted at to answer. */
      .badge {
        flex: 0 0 auto;
        font-size: 11px;
        line-height: 1;
        color: #ed4245;
      }

      #empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="stack"></div>

    <script>
      (function () {
        const stack = document.getElementById('stack');

        /** Two initials, matching the app's avatar fallback. */
        function initials(name) {
          const parts = String(name || '?')
            .split(/\s+/)
            .filter(Boolean);
          if (parts.length === 0) return '?';
          if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
          return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        }

        /**
         * Rebuild only what changed.
         *
         * Speaking flips many times a second, and replacing the DOM on every change would
         * restart the fade-in animation each time -- so rows are keyed by user id and only
         * their class is touched once they exist.
         */
        const rows = new Map();

        window.__rockscordOverlay = function (state) {
          const participants = (state && state.participants) || [];
          const seen = new Set();

          for (const person of participants) {
            seen.add(person.userId);
            let row = rows.get(person.userId);

            if (!row) {
              row = document.createElement('div');
              row.className = 'row';

              const avatar = document.createElement('div');
              avatar.className = 'avatar';
              if (person.avatarUrl) {
                const image = document.createElement('img');
                image.src = person.avatarUrl;
                // A dead avatar URL falls back to initials rather than a broken image.
                image.onerror = function () {
                  avatar.textContent = initials(person.name);
                };
                avatar.appendChild(image);
              } else {
                avatar.textContent = initials(person.name);
              }

              const name = document.createElement('div');
              name.className = 'name';
              name.textContent = person.name;

              const badge = document.createElement('div');
              badge.className = 'badge';

              row.append(avatar, name, badge);
              stack.appendChild(row);
              rows.set(person.userId, row);
            }

            row.classList.toggle('speaking', Boolean(person.speaking));
            const badge = row.lastChild;
            badge.textContent = person.deafened ? '\u{1F507}' : person.muted ? '\u{1F3A4}' : '';
          }

          for (const [userId, row] of rows) {
            if (seen.has(userId)) continue;
            row.remove();
            rows.delete(userId);
          }
        };
      })();
    </script>
  </body>
</html>
