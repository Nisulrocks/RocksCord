# electron-builder configuration.
#
# `directories.app` points at the staged app root produced by scripts/build-desktop.mjs,
# which contains only main.mjs, preload.cjs, and the native modules. Nothing from the
# monorepo (workspace symlinks, dev dependencies, source) is packaged.

# Pinned explicitly: electron-builder needs an exact version to download the matching
# platform binaries, and the workspace manifest carries a semver range.
electronVersion: 44.0.0

appId: dev.rockscord.desktop
productName: RocksCord

directories:
  app: build
  output: release
  buildResources: assets

# Everything else is already bundled into main.mjs by esbuild.
files:
  - '**/*'

# Copied next to the packaged app rather than into the asar, so the server can read them
# from `process.resourcesPath` at runtime.
extraResources:
  - from: resources/web
    to: web
  - from: resources/drizzle
    to: drizzle

# Native addons cannot be loaded from inside an asar archive; they must sit on disk.
asarUnpack:
  - '**/*.node'
  - 'node_modules/libsql/**'
  - 'node_modules/@libsql/**'
  - 'node_modules/@node-rs/**'

# The staged app root already contains exactly the dependencies we want.
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

# Where the app looks for updates, and where `--publish` uploads them.
#
# This has to be readable without credentials: it is written into every copy of the app as
# `app-update.yml`, so a private repo would mean shipping a GitHub token inside the exe.
# The repository must be public.
publish:
  provider: github
  owner: Nisulrocks
  repo: RocksCord
  releaseType: release

# The URL scheme invites use to reach the installed app.
#
# `setAsDefaultProtocolClient` registers this at runtime, but only for the copy that is
# running. Declaring it here makes the installer write the registry entry, so a machine
# where RocksCord has never been launched still resolves `rockscord://` links -- which is
# exactly the case for someone who installs it and is then sent an invite.
protocols:
  - name: RocksCord
    schemes:
      - rockscord

win:
  icon: assets/icon.png
  # Required for unsigned builds. electron-updater otherwise refuses to apply an update
  # whose publisher it cannot verify, which for a build with no certificate is every one.
  verifyUpdateCodeSignature: false
  target:
    - target: portable
    - target: nsis
  # Unsigned builds are normal for a personal project; SmartScreen will warn on first run.
  signAndEditExecutable: true

portable:
  # A single double-clickable file, for anyone who would rather not install. It cannot
  # self-update: it runs from a temporary extraction that is discarded on exit, so there
  # is nothing for an update to be written into. The app detects this and stays quiet.
  artifactName: RocksCord.exe
  # Unpack to a stable folder so repeated launches reuse the same extraction.
  unpackDirName: RocksCordPortable

nsis:
  artifactName: RocksCord-Setup-${version}.exe

  # A real wizard rather than a one-click drop: welcome, install location, progress,
  # finish. Someone installing software they were sent by a friend should be able to see
  # where it is going and change it.
  oneClick: false
  allowToChangeInstallationDirectory: true

  # Per-user, which is what avoids a UAC prompt entirely -- most people receiving this
  # will not have an administrator account, and a shield prompt on an unsigned installer
  # is exactly the moment they abandon it.
  perMachine: false

  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: RocksCord
  menuCategory: false

  # Offer to launch on the final page. Ticked by default.
  runAfterFinish: true

  # Branding. All three are generated from the app icon by `npm run icons`; the sizes are
  # fixed by NSIS and the format must be BMP.
  installerSidebar: installerSidebar.bmp
  uninstallerSidebar: uninstallerSidebar.bmp
  installerHeader: installerHeader.bmp
  installerHeaderIcon: icon.png

  # Leave %APPDATA%\RocksCord alone on uninstall, so reinstalling keeps the chosen server
  # and window position. Removing it silently would also throw away the local database of
  # anyone running their own server.
  deleteAppDataOnUninstall: false

linux:
  icon: assets/icon.png
  target:
    - AppImage
  category: Network

mac:
  icon: assets/icon.png
  target:
    - dmg
  category: public.app-category.social-networking
