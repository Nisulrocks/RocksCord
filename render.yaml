# Render Blueprint — deploys RocksCord as a single free web service.
#
# Render's free tier is the one mainstream host that needs no credit card,
# supports WebSockets, and stays free indefinitely.
#
# To use it:
#   1. Push this repository to GitHub.
#   2. On Render: New -> Blueprint, and point it at your repo.
#   3. Fill in the two variables marked `sync: false` when prompted.
#
# Known free-tier limits (see the README for the full list):
#   - the service sleeps after 15 minutes with no traffic; the next request
#     takes ~50 seconds to wake it
#   - 750 instance-hours per month across your whole workspace
#   - NO persistent disk, which is why uploads must go to Supabase Storage
#     and the database must be Turso rather than a local file

services:
  - type: web
    name: rockscord
    runtime: node
    plan: free
    region: oregon

    # `--include=dev` is required, not optional: NODE_ENV=production (set below, for the
    # running service) makes npm skip devDependencies by default — and TypeScript, Vite,
    # and Tailwind are all devDependencies. Without this the build has no compiler.
    buildCommand: npm ci --include=dev && npm run build

    # `npm start` runs the compiled server, which also serves the built client.
    startCommand: npm start

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      # Render provides PORT; the server reads it.
      - key: HOST
        value: 0.0.0.0

      # Generated once by Render and kept stable across deploys, so people stay
      # signed in when you ship an update.
      - key: JWT_SECRET
        generateValue: true

      # Serve the built client from this same service — one free service total.
      - key: SERVE_CLIENT
        value: 'true'

      # Required for the refresh cookie over HTTPS.
      - key: COOKIE_SECURE
        value: 'true'

      # --- Fill these in when prompted -----------------------------------

      # Your Turso database URL, e.g. libsql://rockscord-you.turso.io
      #   turso db create rockscord && turso db show rockscord --url
      - key: DATABASE_URL
        sync: false

      #   turso db tokens create rockscord
      - key: DATABASE_AUTH_TOKEN
        sync: false

      # --- Email verification ---------------------------------------------
      #
      # Leave these blank and the service still deploys: registration then signs people
      # straight in, exactly as it did before, because no link could be delivered.
      #
      # The recommended transport is plain SMTP through an ordinary mailbox. Gmail allows
      # 500 recipients a day, needs no domain, and has no approval queue -- unlike the
      # hosted APIs, where a new Brevo account is held for manual review and a Resend
      # account without a domain silently delivers only to its own owner.
      #
      # Create an app password at https://myaccount.google.com/apppasswords (2-Step
      # Verification has to be on first), then set these in the Render dashboard. No
      # redeploy is needed -- Render restarts the service when a variable changes.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

      # Alternative to SMTP: a Brevo (xkeysib-...) or Resend (re_...) API key. The right
      # driver is chosen from the prefix. SMTP wins if both are configured.
      - key: EMAIL_API_KEY
        sync: false

      # Defaults to SMTP_USER, so it only needs setting for the HTTP providers.
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: RocksCord

      # --- File uploads ---------------------------------------------------
      #
      # Defaults to `local` so the very first deploy always boots. Free instances have
      # no persistent disk, so uploaded files are lost whenever the service restarts —
      # everything else works normally.
      #
      # For uploads that survive restarts, create a PUBLIC Supabase Storage bucket named
      # `rockscord-uploads`, fill in the two keys below, then change this to `supabase`.
      # The server refuses to start with STORAGE_DRIVER=supabase and blank keys, which is
      # why they are not wired up by default.
      - key: STORAGE_DRIVER
        value: local
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: rockscord-uploads

      # PUBLIC_URL is deliberately NOT listed here.
      #
      # Render exposes the service's address as RENDER_EXTERNAL_URL, and the server reads
      # that automatically, so there is nothing to copy in after the first deploy. Set
      # PUBLIC_URL manually only if you put the service behind a custom domain.

      # Lock this down to your own origin once you know the URL.
      - key: CORS_ORIGIN
        value: '*'
