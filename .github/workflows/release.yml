# Build and publish the desktop installer when a version tag is pushed.
#
# Triggered by the tag rather than by every push to main, because a release is a decision:
# most commits change the server or the web client, which reach people through Render
# without any installer at all. Cutting one per commit would mean everybody's app
# downloading 99 MB to gain nothing.
#
# Usage, from a clean main:
#
#   npm version patch     # bumps package.json, commits, and tags
#   git push --follow-tags
#
# The runner is Windows because this builds an NSIS installer, which needs Windows tooling.

name: Release

on:
  push:
    tags:
      - 'v*'
  # Lets a release be re-cut from the Actions tab without moving a tag, which is useful
  # when a publish failed for a reason that had nothing to do with the code.
  workflow_dispatch:

permissions:
  # Required for the built-in token to create a release and upload assets. Without it the
  # upload fails with the same 403 a personal token missing `contents: write` produces.
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The Electron binary is ~100 MB and identical between runs; downloading it every
      # time roughly doubles the job.
      - name: Cache Electron download
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - run: npm ci

      # Cheap, and it stops a broken build being published to everyone's auto-updater.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check the tag matches package.json
        # Guards the mistake the updater cannot recover from: tagging v1.2.0 while the
        # manifest still says 1.1.1 produces a release nobody is offered, because the
        # updater compares the version inside the build, not the tag.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json $PKG."
            echo "Use 'npm version <patch|minor|major>' so both move together."
            exit 1
          fi
          echo "Releasing $PKG"

      - name: Build and publish
        env:
          # Provided by Actions. No personal access token, and nothing to expire.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The server the shipped app connects to. Set the SERVER_URL repository variable
        # to override it without editing this file.
        run: npm run build:exe -- --server=${{ vars.SERVER_URL || 'https://rockscord.onrender.com' }} --release

      # Kept so a failed publish still leaves something downloadable, rather than an hour
      # of build time with nothing to show for it.
      - name: Upload installer as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RocksCord-installer
          path: apps/desktop/release/RocksCord-Setup-*.exe
          if-no-files-found: warn
          retention-days: 14
