# Build and publish the desktop installer when a version tag is pushed.
#
# Triggered by the tag rather than by every push to main, because a release is a decision:
# most commits change the server or the web client, which reach people through Render
# without any installer at all. Cutting one per commit would mean everybody's app
# downloading 99 MB to gain nothing.
#
# Usage, from a clean main:
#
#   npm version patch     # bumps package.json, commits, and tags
#   git push --follow-tags
#
# The runner is Windows because this builds an NSIS installer, which needs Windows tooling.

name: Release

on:
  push:
    tags:
      - 'v*'
  # Lets a release be re-cut from the Actions tab without moving a tag, which is useful
  # when a publish failed for a reason that had nothing to do with the code.
  workflow_dispatch:

permissions:
  # Required for the built-in token to create a release and upload assets. Without it the
  # upload fails with the same 403 a personal token missing `contents: write` produces.
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The Electron binary is ~100 MB and identical between runs; downloading it every
      # time roughly doubles the job.
      - name: Cache Electron download
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - run: npm ci

      # Cheap, and it stops a broken build being published to everyone's auto-updater.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check the tag matches package.json
        # Guards the mistake the updater cannot recover from: tagging v1.2.0 while the
        # manifest still says 1.1.1 produces a release nobody is offered, because the
        # updater compares the version inside the build, not the tag.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json $PKG."
            echo "Use 'npm version <patch|minor|major>' so both move together."
            exit 1
          fi
          echo "Releasing $PKG"

      - name: Build and publish
        env:
          # Provided by Actions. No personal access token, and nothing to expire.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The server the shipped app connects to. Set the SERVER_URL repository variable
        # to override it without editing this file.
        run: npm run build:exe -- --server=${{ vars.SERVER_URL || 'https://rockscord.onrender.com' }} --release

      # Kept so a failed publish still leaves something downloadable, rather than an hour
      # of build time with nothing to show for it.
      - name: Upload installer as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RocksCord-installer
          path: apps/desktop/release/RocksCord-Setup-*.exe
          if-no-files-found: warn
          retention-days: 14

  # The Android APK, built alongside the Windows installer so one tag produces both.
  #
  # A separate job rather than another step: it needs a Linux runner with the Android SDK
  # and a JDK, none of which the Windows job has, and there is no reason for a failure in
  # one to hold up the other.
  android:
    runs-on: ubuntu-latest

    # The release is created by the Windows job's publish step, so there is nothing to
    # attach an APK to until that has finished. Run in parallel and this job wins the race
    # on most runs -- it is far quicker -- and fails with a bare "release not found".
    #
    # `always()` keeps the APK building even when the desktop build fails, so a broken
    # installer does not also cost the Android app; the upload step below handles the
    # release being absent in that case.
    needs: windows
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Gradle 8.11 supports up to Java 23, and the runner's default is newer. Pinning 21
      # is what keeps this from failing with an unhelpful "Unsupported class file major
      # version" the first time GitHub bumps its image.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Build the APK
        # The server the app talks to, same variable the desktop build uses so the two
        # cannot drift apart.
        env:
          ROCKSCORD_SERVER_URL: ${{ vars.SERVER_URL || 'https://rockscord.onrender.com' }}
        run: |
          set -o pipefail
          npm run build:apk 2>&1 | tee /tmp/apk-build.log

      # Job logs need admin rights to download and step summaries are not served by the
      # REST API either -- but annotations are, so the reason is emitted as one. Newlines
      # must be percent-encoded or the annotation is cut off at the first.
      - name: Surface the failure
        if: failure()
        run: |
          LOG=$(tail -c 4000 /tmp/apk-build.log | sed 's/%/%25/g' | tr '\n' '~')
          echo "::error title=Android build::${LOG//\~/%0A}"

      - name: Name it after the version
        id: apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SRC=apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          DEST="RocksCord-$VERSION.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      # Downloadable even when the tag is absent, so a dispatch run still produces
      # something installable.
      - name: Upload the APK as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RocksCord-apk
          path: RocksCord-*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `--clobber` so re-running a release replaces the asset instead of failing on a
        # name that already exists.
        #
        # Absent release is not treated as an error: it means the desktop build failed
        # before creating one, which is already reported by that job. Failing here too
        # would just bury a working APK under a second red cross.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" --clobber
          else
            echo "No release for $GITHUB_REF_NAME yet; the APK is attached to this run instead."
          fi
